[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "prefect-sqlalchemy-entra"
dependencies = ["sqlalchemy>=1.4.31,<3", "prefect>=3.6.17", "azure-identity>=1.15.0"]
dynamic = ["version"]
description = "Prefect integrations for working with databases, with Microsoft Entra ID token authentication"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache License 2.0" }
keywords = ["prefect"]
authors = [{ name = "Prefect Technologies, Inc.", email = "help@prefect.io" }]
classifiers = [
  "Natural Language :: English",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[dependency-groups]
dev = [
  "aiosqlite",
  "asyncpg",
  "coverage",
  "interrogate",
  "mkdocs-gen-files",
  "mkdocs-material",
  "mkdocs",
  "mkdocstrings[python]",
  "mypy",
  "pillow",
  "pre-commit",
  "psycopg2-binary",
  "pytest >= 8.3",
  "pytest-asyncio",
  "pytest-env",
  "pytest-xdist",
]

[project.urls]
Homepage = "https://github.com/rafagsiqueira/prefect-sqlalchemy-entra"
Upstream = "https://github.com/PrefectHQ/prefect/tree/main/src/integrations/prefect-sqlalchemy"

[project.entry-points."prefect.collections"]
prefect_sqlalchemy_entra = "prefect_sqlalchemy_entra"

[tool.setuptools_scm]
version_file = "prefect_sqlalchemy_entra/_version.py"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+(?:[a-zA-Z0-9]+(?:\\.[a-zA-Z0-9]+)*)?)$"
fallback_version = "0.1.0"

[tool.interrogate]
ignore-init-module = true
ignore_init_method = true
exclude = ["prefect_sqlalchemy_entra/_version.py", "tests"]
fail-under = 95
omit-covered-files = true

[tool.coverage.run]
omit = ["tests/*", "prefect_sqlalchemy_entra/_version.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
env = ["PREFECT_TEST_MODE=1"]
